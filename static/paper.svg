<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!-- Riso stock: cloudy warm mottling, then sparse fibre flecks. Both tile seamlessly. -->
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0045" numOctaves="4" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.706  0 0 0 0 0.651  0 0 0 0 0.549  0 0 0 -2.2 1.25"/>
  </filter>
  <filter id="fleck" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.49  0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 -9 5.2"/>
  </filter>
  <rect width="640" height="640" fill="#F4EEE2"/>
  <rect width="640" height="640" filter="url(#mottle)" opacity="0.32"/>
  <rect width="640" height="640" filter="url(#fleck)" opacity="0.35"/>
</svg>
